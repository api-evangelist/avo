aid: avo
name: AVO
description: 'Avo (avonow.com) was a New York City-based "building commerce" and workplace-amenity
  platform, founded 2017-2018 out of Y Combinator (S18) and backed by Insight Partners and
  Kleiner Perkins with roughly $84M raised. It offered white-labeled same-day delivery of
  groceries, household goods, alcohol and personal-care items into residential and office
  buildings with no order minimums or delivery fees, plus on-site and virtual event
  programming and corporate gifting and recognition services, serving apartment communities,
  corporations, hospitals and universities across New York, New Jersey, Chicago and Houston.
  Avo published no API, SDK or developer portal, and as of a 2026-07-20 probe its domain
  resolves to a parked lander with no operational hosts; Y Combinator lists the company as
  inactive.'
